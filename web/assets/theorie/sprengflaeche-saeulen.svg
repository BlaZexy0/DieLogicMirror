<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Blick auf die Trennebene: Aufspannplatte mit vier Säulen, Sprengfläche aus Bauteil, Anguss, Überläufen und Pressrest mit Schwerpunkt S und Außermittigkeit zu Maschinenmitte 0">
  <defs>
    <marker id="dimA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4c6870"/>
    </marker>
    <marker id="dimB" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M10 0 L0 5 L10 10 Z" fill="#4c6870"/>
    </marker>
    <marker id="dimE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#00534d"/>
    </marker>
  </defs>

  <!-- Aufspannplatte -->
  <rect x="60" y="50" width="440" height="320" rx="10" fill="#eef1f2" stroke="#9aacb4" stroke-width="1.4"/>

  <!-- Mittellinien durch die Maschinenmitte 0 -->
  <line x1="68" y1="210" x2="492" y2="210" stroke="#9aacb4" stroke-width="1" stroke-dasharray="7 5"/>
  <line x1="280" y1="58" x2="280" y2="362" stroke="#9aacb4" stroke-width="1" stroke-dasharray="7 5"/>

  <!-- Sprengfläche: Silhouette aus Bauteil, Anguss, Überläufen und Pressrest.
       Flächen (Bauteil 130×100, Anguss 26×58, drei Überläufe 22×18, Pressrest r=22)
       ergeben den Schwerpunkt S ≈ (350, 178). -->
  <rect x="280" y="114" width="130" height="100" rx="8" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <rect x="360" y="214" width="26" height="58" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <circle cx="373" cy="292" r="22" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <rect x="296" y="96" width="22" height="18" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <rect x="332" y="96" width="22" height="18" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <rect x="368" y="96" width="22" height="18" fill="#cfe7e4" stroke="#00534d" stroke-width="1.6"/>
  <text x="418" y="150" font-size="12" fill="#00534d" font-weight="700">A</text>
  <text x="418" y="164" font-size="10" fill="#4c6870">Sprengfläche</text>
  <text x="336" y="91" font-size="10" fill="#4c6870">Überläufe</text>
  <text x="276" y="180" font-size="10" fill="#4c6870" text-anchor="end">Bauteil</text>
  <text x="392" y="247" font-size="10" fill="#4c6870">Anguss</text>
  <text x="373" y="330" font-size="10" fill="#4c6870" text-anchor="middle">Pressrest</text>

  <!-- Säulen an (±a_x/2, ±a_y/2) -->
  <g fill="#ccd4d6" stroke="#4c6870" stroke-width="1.4">
    <circle cx="120" cy="110" r="17"/><circle cx="440" cy="110" r="17"/>
    <circle cx="120" cy="310" r="17"/><circle cx="440" cy="310" r="17"/>
  </g>
  <g fill="#f8fafa" stroke="#4c6870" stroke-width="1">
    <circle cx="120" cy="110" r="7"/><circle cx="440" cy="110" r="7"/>
    <circle cx="120" cy="310" r="7"/><circle cx="440" cy="310" r="7"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#002733">
    <text x="462" y="102">F<tspan dy="3" font-size="9.5">1</tspan></text>
    <text x="78" y="102" text-anchor="end">F<tspan dy="3" font-size="9.5">2</tspan></text>
    <text x="78" y="326" text-anchor="end">F<tspan dy="3" font-size="9.5">3</tspan></text>
    <text x="462" y="326">F<tspan dy="3" font-size="9.5">4</tspan></text>
  </g>
  <text x="120" y="90" font-size="10" fill="#4c6870" text-anchor="middle">Säule</text>

  <!-- Maschinenmitte 0 -->
  <circle cx="280" cy="210" r="3.2" fill="#002733"/>
  <text x="269" y="228" font-size="12" font-weight="700" fill="#002733">0</text>

  <!-- Schwerpunkt S mit Kraft aus der Ebene heraus -->
  <circle cx="350" cy="178" r="7" fill="#ffffff" stroke="#002733" stroke-width="1.6"/>
  <circle cx="350" cy="178" r="2" fill="#002733"/>
  <text x="362" y="174" font-size="12" font-weight="700" fill="#002733">S</text>
  <text x="362" y="188" font-size="10.5" fill="#4c6870">F = p·A (aus der Ebene)</text>

  <!-- Außermittigkeit e_x, e_y -->
  <line x1="280" y1="210" x2="344" y2="210" stroke="#00534d" stroke-width="1.6" marker-end="url(#dimE)"/>
  <text x="312" y="226" font-size="11.5" font-weight="700" fill="#00534d" text-anchor="middle">e<tspan dy="2.5" font-size="9">x</tspan></text>
  <line x1="350" y1="210" x2="350" y2="190" stroke="#00534d" stroke-width="1.6" marker-end="url(#dimE)"/>
  <text x="357" y="204" font-size="11.5" font-weight="700" fill="#00534d">e<tspan dy="2.5" font-size="9">y</tspan></text>

  <!-- Maß a_x (Säulenabstand horizontal) -->
  <line x1="120" y1="88" x2="120" y2="70" stroke="#4c6870" stroke-width="0.9"/>
  <line x1="440" y1="88" x2="440" y2="70" stroke="#4c6870" stroke-width="0.9"/>
  <line x1="126" y1="74" x2="434" y2="74" stroke="#4c6870" stroke-width="1" marker-start="url(#dimB)" marker-end="url(#dimA)"/>
  <text x="280" y="68" font-size="11.5" font-weight="700" fill="#4c6870" text-anchor="middle">a<tspan dy="2.5" font-size="9">x</tspan></text>

  <!-- Maß a_y (Säulenabstand vertikal) -->
  <line x1="98" y1="110" x2="82" y2="110" stroke="#4c6870" stroke-width="0.9"/>
  <line x1="98" y1="310" x2="82" y2="310" stroke="#4c6870" stroke-width="0.9"/>
  <line x1="86" y1="116" x2="86" y2="304" stroke="#4c6870" stroke-width="1" marker-start="url(#dimB)" marker-end="url(#dimA)"/>
  <text x="80" y="214" font-size="11.5" font-weight="700" fill="#4c6870" text-anchor="middle" transform="rotate(-90 80 214)">a<tspan dy="2.5" font-size="9">y</tspan></text>

  <!-- Koordinatenrichtungen -->
  <line x1="168" y1="352" x2="204" y2="352" stroke="#9aacb4" stroke-width="1.4" marker-end="url(#dimA)"/>
  <text x="210" y="356" font-size="10.5" fill="#4c6870">x</text>
  <line x1="168" y1="352" x2="168" y2="336" stroke="#9aacb4" stroke-width="1.4" marker-end="url(#dimA)"/>
  <text x="164" y="330" font-size="10.5" fill="#4c6870">y</text>

  <!-- Beschriftung Platte -->
  <text x="490" y="364" font-size="10" fill="#9aacb4" text-anchor="end">Blick auf die Trennebene</text>
</svg>
