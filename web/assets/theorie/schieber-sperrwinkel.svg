<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Seitenschieber im Schnitt: Metalldruck auf die Kernfläche, Abstützschräge mit Sperrwinkel und Kraftkomponente in Formöffnungsrichtung">
  <!-- Farben sind Rollen der Palette (shared/palette.js): die Klasse nennt
       die Rolle, der Wert daneben ist ihr Standard (shared/svgfarben.js färbt
       das Bild nach dem Schema). Schmelze, ihr Druck und die Kraft daraus in
       `melt`; Schieber und Abstützschräge Stahl (`steel`, Kante und Schraffur
       `steel-dark`); die Richtungen wie im 3D-Studio: Formöffnung `axis-z`,
       die Zugrichtung des Schiebers quer dazu `axis-x`. Hervorgehoben in
       `mark`: der Anteil F_S·tan α, den die Zuhaltung tragen muss.
       Beschriftung `text`/`muted`, Hilfslinien `muted-light`. -->
  <defs>
    <pattern id="hatch-sw" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect width="7" height="7" fill="#dae1e2" fill-opacity="0.55" class="f-steel"/>
      <path d="M-1 8 L8 -1" stroke="#7b9096" stroke-opacity="0.75" stroke-width="1" class="s-steel-dark"/>
    </pattern>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#008c82" class="f-melt"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b23797" class="f-mark"/>
    </marker>
    <marker id="arrZ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e65a0" class="f-axis-z"/>
    </marker>
    <marker id="arrX" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#846cd1" class="f-axis-x"/>
    </marker>
  </defs>

  <!-- Schmelze links -->
  <rect x="24" y="110" width="88" height="92" fill="#008c82" fill-opacity="0.2" stroke="#008c82" stroke-width="1.4" class="f-melt s-melt"/>
  <text x="68" y="100" font-size="10.5" fill="#002733" class="f-text" text-anchor="middle">Schmelze (p)</text>

  <!-- Druckpfeile auf die Kernfläche -->
  <line x1="78" y1="126" x2="106" y2="126" stroke="#008c82" stroke-width="1.8" class="s-melt" marker-end="url(#arrP)"/>
  <line x1="78" y1="156" x2="106" y2="156" stroke="#008c82" stroke-width="1.8" class="s-melt" marker-end="url(#arrP)"/>
  <line x1="78" y1="186" x2="106" y2="186" stroke="#008c82" stroke-width="1.8" class="s-melt" marker-end="url(#arrP)"/>

  <!-- Kernfläche A_S (in Zugrichtung projiziert) -->
  <line x1="112" y1="110" x2="112" y2="202" stroke="#008c82" stroke-width="2.6" class="s-melt"/>
  <text x="104" y="226" font-size="11.5" font-weight="700" fill="#002733" class="f-text">A<tspan dy="2.5" font-size="9">S</tspan></text>
  <text x="122" y="226" font-size="10" fill="#4c6870" class="f-muted">(Projektion in Zugrichtung)</text>

  <!-- Schieber -->
  <rect x="112" y="110" width="148" height="92" fill="#dae1e2" stroke="#7b9096" stroke-width="1.4" class="f-steel s-steel-dark"/>
  <text x="180" y="161" font-size="11" fill="#002733" class="f-text" text-anchor="middle">Schieber</text>
  <line x1="176" y1="240" x2="236" y2="240" stroke="#846cd1" stroke-width="1.4" stroke-dasharray="6 4" class="s-axis-x" marker-end="url(#arrX)"/>
  <text x="206" y="256" font-size="10.5" fill="#4c6870" class="f-muted" text-anchor="middle">Zugrichtung</text>

  <!-- Abstützschräge (bewegliche Hälfte): Fläche um α gegen die Öffnungsrichtung geneigt -->
  <polygon points="260,110 276,202 356,202 356,110" fill="url(#hatch-sw)" stroke="#7b9096" stroke-width="1.4" class="s-steel-dark"/>
  <text x="364" y="150" font-size="10.5" fill="#4c6870" class="f-muted">Abstützschräge</text>
  <text x="364" y="164" font-size="10.5" fill="#4c6870" class="f-muted">(bewegl. Hälfte)</text>

  <!-- Sperrwinkel α: Referenz = Öffnungsrichtung (vertikal) -->
  <line x1="260" y1="110" x2="260" y2="202" stroke="#9aacb4" stroke-width="1" stroke-dasharray="4 3" class="s-muted-light"/>
  <path d="M 260 168 A 30 30 0 0 1 270 166" fill="none" stroke="#4c6870" stroke-width="1.3" class="s-muted"/>
  <text x="272" y="182" font-size="11.5" font-weight="700" fill="#4c6870" class="f-muted">α</text>

  <!-- Kräfte an der Schräge -->
  <line x1="212" y1="146" x2="260" y2="146" stroke="#008c82" stroke-width="2" class="s-melt" marker-end="url(#arrP)"/>
  <text x="150" y="136" font-size="11" font-weight="700" fill="#002733" class="f-text">F<tspan dy="2.5" font-size="8.5">S</tspan><tspan dy="-2.5"> = p·A</tspan><tspan dy="2.5" font-size="8.5">S</tspan></text>
  <line x1="268" y1="106" x2="268" y2="52" stroke="#b23797" stroke-width="2" class="s-mark" marker-end="url(#arrR)"/>
  <text x="256" y="66" font-size="11" font-weight="700" fill="#b23797" class="f-mark" text-anchor="end">F<tspan dy="2.5" font-size="8.5">S</tspan><tspan dy="-2.5">·tan α</tspan></text>
  <text x="256" y="80" font-size="10" fill="#4c6870" class="f-muted" text-anchor="end">wirkt in Öffnungsrichtung</text>

  <!-- Formöffnungsrichtung -->
  <line x1="446" y1="210" x2="446" y2="70" stroke="#2e65a0" stroke-width="1.6" class="s-axis-z" marker-end="url(#arrZ)"/>
  <text x="458" y="140" font-size="10.5" fill="#4c6870" class="f-muted" transform="rotate(-90 458 140)" text-anchor="middle">Formöffnung</text>
</svg>
