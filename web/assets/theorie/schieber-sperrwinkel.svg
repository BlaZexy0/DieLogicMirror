<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Seitenschieber im Schnitt: Metalldruck auf die Kernfläche, Abstützschräge mit Sperrwinkel und Kraftkomponente in Formöffnungsrichtung">
  <defs>
    <pattern id="hatch-sw" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M-1 8 L8 -1" stroke="#9aacb4" stroke-width="1"/>
    </pattern>
    <marker id="arrP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#00534d"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b42318"/>
    </marker>
    <marker id="arrM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#9aacb4"/>
    </marker>
  </defs>

  <!-- Schmelze links -->
  <rect x="24" y="110" width="88" height="92" fill="#cfe7e4" stroke="#00534d" stroke-width="1.4"/>
  <text x="68" y="100" font-size="10.5" fill="#00534d" text-anchor="middle">Schmelze (p)</text>

  <!-- Druckpfeile auf die Kernfläche -->
  <line x1="78" y1="126" x2="106" y2="126" stroke="#00534d" stroke-width="1.8" marker-end="url(#arrP)"/>
  <line x1="78" y1="156" x2="106" y2="156" stroke="#00534d" stroke-width="1.8" marker-end="url(#arrP)"/>
  <line x1="78" y1="186" x2="106" y2="186" stroke="#00534d" stroke-width="1.8" marker-end="url(#arrP)"/>

  <!-- Kernfläche A_S (in Zugrichtung projiziert) -->
  <line x1="112" y1="110" x2="112" y2="202" stroke="#00534d" stroke-width="2.6"/>
  <text x="104" y="226" font-size="11.5" font-weight="700" fill="#00534d">A<tspan dy="2.5" font-size="9">S</tspan></text>
  <text x="122" y="226" font-size="10" fill="#4c6870">(Projektion in Zugrichtung)</text>

  <!-- Schieber -->
  <rect x="112" y="110" width="148" height="92" fill="#ccd4d6" stroke="#4c6870" stroke-width="1.4"/>
  <text x="180" y="161" font-size="11" fill="#2a3f4a" text-anchor="middle">Schieber</text>
  <line x1="176" y1="240" x2="236" y2="240" stroke="#9aacb4" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrM)"/>
  <text x="206" y="256" font-size="10.5" fill="#4c6870" text-anchor="middle">Zugrichtung</text>

  <!-- Abstützschräge (bewegliche Hälfte): Fläche um α gegen die Öffnungsrichtung geneigt -->
  <polygon points="260,110 276,202 356,202 356,110" fill="url(#hatch-sw)" stroke="#4c6870" stroke-width="1.4"/>
  <text x="364" y="150" font-size="10.5" fill="#4c6870">Abstützschräge</text>
  <text x="364" y="164" font-size="10.5" fill="#4c6870">(bewegl. Hälfte)</text>

  <!-- Sperrwinkel α: Referenz = Öffnungsrichtung (vertikal) -->
  <line x1="260" y1="110" x2="260" y2="202" stroke="#9aacb4" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 260 168 A 30 30 0 0 1 270 166" fill="none" stroke="#4c6870" stroke-width="1.3"/>
  <text x="272" y="182" font-size="11.5" font-weight="700" fill="#4c6870">α</text>

  <!-- Kräfte an der Schräge -->
  <line x1="212" y1="146" x2="260" y2="146" stroke="#00534d" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="150" y="136" font-size="11" font-weight="700" fill="#00534d">F<tspan dy="2.5" font-size="8.5">S</tspan><tspan dy="-2.5"> = p·A</tspan><tspan dy="2.5" font-size="8.5">S</tspan></text>
  <line x1="268" y1="106" x2="268" y2="52" stroke="#b42318" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="256" y="66" font-size="11" font-weight="700" fill="#b42318" text-anchor="end">F<tspan dy="2.5" font-size="8.5">S</tspan><tspan dy="-2.5">·tan α</tspan></text>
  <text x="256" y="80" font-size="10" fill="#4c6870" text-anchor="end">wirkt in Öffnungsrichtung</text>

  <!-- Formöffnungsrichtung -->
  <line x1="446" y1="210" x2="446" y2="70" stroke="#9aacb4" stroke-width="1.6" marker-end="url(#arrM)"/>
  <text x="458" y="140" font-size="10.5" fill="#4c6870" transform="rotate(-90 458 140)" text-anchor="middle">Formöffnung</text>
</svg>
