<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Füllkammer im Längsschnitt: Wellenkamm erreicht bei kritischer Kolbengeschwindigkeit die Kammerdecke">
  <!-- Farben sind Rollen der Palette (shared/palette.js): die Klasse nennt
       die Rolle, der Wert daneben ist ihr Standard (shared/svgfarben.js färbt
       das Bild nach dem Schema). Kammerwand `steel` mit Schraffur und Kante
       in `steel-dark`, Schmelze `melt` (hell über fill-opacity), Kolben und
       Stange `piston`, der Pfeil der Kolbengeschwindigkeit ebenfalls
       `piston`, Beschriftung `text`/`muted`. -->
  <defs>
    <pattern id="hatch-b" patternUnits="userSpaceOnUse" width="7" height="7">
      <rect width="7" height="7" fill="#dae1e2" class="f-steel"/>
      <path d="M-1 8 L8 -1" stroke="#7b9096" stroke-opacity="0.7" stroke-width="1" class="s-steel-dark"/>
    </pattern>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#36545d" class="f-piston"/>
    </marker>
  </defs>
  <!-- Kammerwände -->
  <rect x="10" y="22" width="320" height="14" fill="url(#hatch-b)" stroke="#7b9096" stroke-width="1.2" class="s-steel-dark"/>
  <rect x="10" y="174" width="320" height="14" fill="url(#hatch-b)" stroke="#7b9096" stroke-width="1.2" class="s-steel-dark"/>
  <!-- Schmelze: Kamm berührt die Decke -->
  <path d="M64 37 L150 37 C168 38 178 54 188 78 C198 102 212 124 238 132 L330 134 L330 174 L64 174 Z"
        fill="#008c82" fill-opacity="0.3" stroke="#008c82" stroke-width="1.5" stroke-linejoin="round" class="f-melt s-melt"/>
  <!-- Kolben -->
  <rect x="0" y="96" width="30" height="18" fill="#36545d" fill-opacity="0.55" stroke="#36545d" stroke-width="1.2" class="f-piston s-piston"/>
  <rect x="30" y="38" width="34" height="134" fill="#36545d" stroke="#36545d" stroke-width="1.2" class="f-piston s-piston"/>
  <!-- Bewegung -->
  <line x1="72" y1="150" x2="106" y2="150" stroke="#36545d" stroke-width="2" class="s-piston" marker-end="url(#arr-b)"/>
  <text x="78" y="143" font-size="11" font-weight="700" fill="#002733" class="f-text">v<tspan dy="2.5" font-size="8.5">K</tspan></text>
  <!-- Beschriftung -->
  <text x="212" y="52" font-size="11" fill="#4c6870" class="f-muted">h<tspan dy="2.5" font-size="8.5">K</tspan><tspan dy="-2.5"> = D</tspan></text>
  <line x1="209" y1="54" x2="158" y2="42" stroke="#4c6870" stroke-width="1" class="s-muted"/>
  <text x="272" y="88" font-size="11" fill="#4c6870" class="f-muted">Luft</text>
  <text x="170" y="206" font-size="14" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">v<tspan dy="3" font-size="10.5">K</tspan><tspan dy="-3"> = v</tspan><tspan dy="3" font-size="10.5">krit</tspan></text>
</svg>
