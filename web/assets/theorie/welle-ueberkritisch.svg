<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 210" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Füllkammer im Längsschnitt: überkritische Kolbengeschwindigkeit — die Welle überschlägt sich und schließt Luft ein">
  <defs>
    <pattern id="hatch-c" patternUnits="userSpaceOnUse" width="7" height="7">
      <path d="M-1 8 L8 -1" stroke="#9aacb4" stroke-width="1"/>
    </pattern>
    <marker id="arr-c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#00534d"/>
    </marker>
  </defs>
  <!-- Kammerwände -->
  <rect x="10" y="22" width="320" height="14" fill="url(#hatch-c)" stroke="#4c6870" stroke-width="1.2"/>
  <rect x="10" y="174" width="320" height="14" fill="url(#hatch-c)" stroke="#4c6870" stroke-width="1.2"/>
  <!-- Schmelze: überschlagende Welle -->
  <path d="M64 37 L150 37 C182 39 204 52 202 76 C200 96 182 106 166 98 C156 92 156 80 166 76 C158 84 162 92 172 92 C184 92 190 82 188 72 C186 58 170 52 152 56 C160 76 158 100 170 114 C182 126 200 131 224 133 L330 135 L330 174 L64 174 Z"
        fill="#aedcd5" stroke="#00534d" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- eingeschlagene Luftblasen -->
  <circle cx="176" cy="84" r="7" fill="#f8fafa" stroke="#4c6870" stroke-width="1"/>
  <circle cx="196" cy="148" r="4.5" fill="#f8fafa" stroke="#4c6870" stroke-width="1"/>
  <circle cx="222" cy="158" r="3" fill="#f8fafa" stroke="#4c6870" stroke-width="1"/>
  <!-- Kolben -->
  <rect x="0" y="96" width="30" height="18" fill="#557786" stroke="#2a3f4a" stroke-width="1.2"/>
  <rect x="30" y="38" width="34" height="134" fill="#557786" stroke="#2a3f4a" stroke-width="1.2"/>
  <!-- Bewegung -->
  <line x1="72" y1="150" x2="112" y2="150" stroke="#00534d" stroke-width="2.4" marker-end="url(#arr-c)"/>
  <text x="78" y="143" font-size="11" font-weight="700" fill="#00534d">v<tspan dy="2.5" font-size="8.5">K</tspan></text>
  <!-- Beschriftung -->
  <text x="330" y="56" font-size="11" fill="#4c6870" text-anchor="end">Luft wird eingeschlagen</text>
  <line x1="212" y1="58" x2="184" y2="78" stroke="#4c6870" stroke-width="1"/>
  <text x="170" y="206" font-size="14" font-weight="700" fill="#002733" text-anchor="middle">v<tspan dy="3" font-size="10.5">K</tspan><tspan dy="-3"> &#62; v</tspan><tspan dy="3" font-size="10.5">krit</tspan></text>
</svg>
