<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Druckkette: Druckspeicher, Antriebskolben, Füllkammer bis zur Trennebene, Anguss steigt in die Kavität beider Formhälften">
  <!-- Handgezeichnetes Schema, angelehnt an das Füllkammer-Schema des
       Dashboards. Konventionen: keine Zahlenwerte, nur Formelzeichen;
       Indizes als tspan (70 %, dy 3); Ölkreis gold, Schmelze petrol,
       Stahl grau, Formhälften schraffiert. Die Füllkammer endet an der
       Trennebene, der Anguss steigt dort in eine Kavität, die in beiden
       Hälften liegt. Drücke: p_acc (Speicher), p_hyd (Antriebskolben),
       p_m (Metalldruck in der Kammer). -->
  <defs>
    <pattern id="die-hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#eef2f4"/>
      <path d="M0 7 L7 0" stroke="#a9bcc3" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ── Stations-Überschriften ── -->
  <text x="110" y="30" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">① Druckspeicher</text>
  <text x="110" y="48" font-size="11.5" fill="#475569" text-anchor="middle">p<tspan font-size="70%" dy="3">acc</tspan></text>
  <text x="368" y="30" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">② Antriebskolben, Fläche A<tspan font-size="70%" dy="3">h</tspan></text>
  <text x="368" y="48" font-size="11.5" fill="#475569" text-anchor="middle">p<tspan font-size="70%" dy="3">hyd</tspan><tspan dy="-3"> = p</tspan><tspan font-size="70%" dy="3">acc</tspan><tspan dy="-3"> − K</tspan><tspan font-size="70%" dy="3">v</tspan><tspan dy="-3">·v²</tspan></text>
  <text x="628" y="30" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">③ Füllkammer, Fläche A<tspan font-size="70%" dy="3">K</tspan></text>
  <text x="628" y="48" font-size="11.5" fill="#475569" text-anchor="middle">p<tspan font-size="70%" dy="3">m</tspan><tspan dy="-3"> = p</tspan><tspan font-size="70%" dy="3">hyd</tspan><tspan dy="-3"> · A</tspan><tspan font-size="70%" dy="3">h</tspan><tspan dy="-3">/A</tspan><tspan font-size="70%" dy="3">K</tspan></text>
  <text x="815" y="30" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">④ Anschnitt</text>
  <text x="815" y="48" font-size="11.5" fill="#475569" text-anchor="middle">p<tspan font-size="70%" dy="3">m</tspan><tspan dy="-3"> → ½·ρ·v</tspan><tspan font-size="70%" dy="3">a</tspan><tspan dy="-3">²</tspan></text>

  <!-- ── ① Druckspeicher: große Flasche, Gaspolster über Öl ── -->
  <path d="M60 102 Q60 80 110 80 Q160 80 160 102 L160 310 L60 310 Z" fill="#e8edf1"/>
  <path d="M60 186 Q85 178 110 186 T160 186 L160 310 L60 310 Z" fill="rgba(224,164,0,.25)"/>
  <path d="M60 102 Q60 80 110 80 Q160 80 160 102 L160 310 L60 310 Z" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M60 186 Q85 178 110 186 T160 186" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="110" y="140" font-size="11" fill="#64748b" text-anchor="middle">Gaspolster</text>
  <text x="110" y="255" font-size="11" fill="#9a7100" text-anchor="middle">Öl · p<tspan font-size="70%" dy="3">acc</tspan></text>

  <!-- Leitung mit Drossel: unten aus der Flasche, T-Stück von unten in den Zylinderboden -->
  <rect x="160" y="284" width="150" height="14" fill="rgba(224,164,0,.25)"/>
  <rect x="286" y="264" width="24" height="20" fill="rgba(224,164,0,.25)"/>
  <path d="M160 284 L286 284 L286 264 M160 298 L310 298 L310 264" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M212 277 L232 277 L222 284 Z" fill="#64748b"/>
  <path d="M212 305 L232 305 L222 298 Z" fill="#64748b"/>
  <text x="224" y="318" font-size="10.5" fill="#64748b" text-anchor="middle">Drossel −K<tspan font-size="70%" dy="3">v</tspan><tspan dy="-3">·v²</tspan></text>

  <!-- ── ② Antriebszylinder: kleiner als die Flasche ── -->
  <rect x="284" y="158" width="86" height="104" fill="rgba(224,164,0,.25)"/>
  <path d="M282 264 L282 156 L462 156 L462 194 M462 226 L462 264 L310 264 M286 264 L282 264" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="370" y="158" width="22" height="104" fill="#475569"/>
  <rect x="392" y="194" width="150" height="32" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <text x="330" y="216" font-size="13" font-weight="700" fill="#9a7100" text-anchor="middle">p<tspan font-size="70%" dy="3">hyd</tspan></text>

  <!-- ── Formhälften: Kammer endet an der Trennebene, Kavität in beiden Hälften ── -->
  <path d="M700 66 L806 66 L806 322 L700 322 Z" fill="url(#die-hatch)" stroke="#7d949c" stroke-width="1.5"/>
  <path d="M806 66 L876 66 L876 322 L806 322 Z" fill="url(#die-hatch)" stroke="#7d949c" stroke-width="1.5"/>
  <!-- Kavität (beide Hälften) und Anguss an der Trennebene freistellen -->
  <rect x="772" y="80" width="68" height="80" fill="#fff"/>
  <rect x="794" y="160" width="24" height="28" fill="#fff"/>
  <rect x="700" y="188" width="118" height="42" fill="#fff"/>
  <path d="M772 80 L840 80 L840 160 L818 160 L818 188 M772 80 L772 160 L794 160 L794 188" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <line x1="806" y1="66" x2="806" y2="322" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="806" y="338" font-size="10.5" fill="#64748b" text-anchor="middle">Trennebene</text>
  <text x="806" y="100" font-size="10.5" fill="#475569" text-anchor="middle">Kavität</text>
  <text x="752" y="308" font-size="9.5" fill="#64748b" text-anchor="middle">feste Seite</text>
  <text x="841" y="308" font-size="9.5" fill="#64748b" text-anchor="middle">Auswerferseite</text>

  <!-- ── ③ Füllkammer: Rohr bis zur Trennebene, Einfüllöffnung oben ── -->
  <path d="M542 188 L560 188 M604 188 L700 188 M542 230 L700 230" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M700 188 L794 188 M700 230 L818 230 L818 160" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M560 188 L560 168 L554 158 M604 188 L604 168 L610 158" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <text x="582" y="150" font-size="10.5" fill="#64748b" text-anchor="middle">Einfüllöffnung</text>
  <!-- Schmelze: Kammer voll, Anguss und untere Kavität teilgefüllt -->
  <rect x="630" y="190" width="188" height="40" fill="rgba(0,140,130,.30)"/>
  <rect x="794" y="162" width="24" height="28" fill="rgba(0,140,130,.30)"/>
  <rect x="774" y="126" width="64" height="34" fill="rgba(0,140,130,.30)"/>
  <rect x="542" y="190" width="90" height="40" fill="#475569"/>
  <text x="587" y="215" font-size="10" fill="#e8edf1" text-anchor="middle">Gießkolben</text>
  <text x="712" y="205" font-size="11.5" font-weight="700" fill="#00655e" text-anchor="middle">Schmelze</text>
  <text x="712" y="221" font-size="11" font-weight="700" fill="#00655e" text-anchor="middle">p<tspan font-size="70%" dy="3">m</tspan></text>
</svg>
