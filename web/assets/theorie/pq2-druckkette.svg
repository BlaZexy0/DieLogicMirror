<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 392" font-family="Inter, -apple-system, 'Segoe UI', Arial, sans-serif" role="img" aria-label="Druckkette des Schussaggregats: der Druckspeicher über dem Antriebszylinder, dazwischen die Drossel; die Kolbenstange schiebt den Gießkolben durch die Füllkammer, die Einfüllöffnung direkt vor ihm, die Kammer endet bündig an der Trennebene; von dort steigt der Anguss über den Anschnitt ins Gussteil">
  <!-- Handgezeichnetes Schema für theorie/pq2.html: der Weg des Öls und der
       Schmelze durch die vier Stationen der Bildunterschrift.
       Der Druckspeicher sitzt über dem Antriebszylinder, die Drossel in der
       Leitung dazwischen; die Kolbenstange ist kurz, die Einfüllöffnung liegt
       gleich vor dem zurückgezogenen Gießkolben; die Füllkammer endet bündig
       an der Trennebene, der Anguss steigt von dort in der Trennebene zum
       Anschnitt und ins Gussteil (vereinfacht, in beiden Formhälften).
       Kein Druckverlauf und keine Formeln im Bild: die stehen in der
       Bildunterschrift. Indizes als tspan (72 %, dy 3).
       Farben sind Rollen der Palette (shared/palette.js): die Klasse nennt
       die Rolle (f-… Füllung, s-… Strich), der Wert daneben ist ihr Standard;
       shared/svgfarben.js färbt das Bild auf der Seite nach dem gewählten
       Schema. Öl und Hydraulik in `machine` wie die Maschinenlinie, das
       Gaspolster in `air`, Schmelze und Gussteil in `melt`, Kolben und Stange
       in `piston`, Form und Wände in `steel`/`steel-dark`, Beschriftung in
       `text`/`muted`. Helle Flächen über fill-opacity. -->
  <defs>
    <pattern id="die-hatch" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#dae1e2" fill-opacity="0.55" class="f-steel"/>
      <path d="M0 7 L7 0" stroke="#7b9096" stroke-opacity="0.45" stroke-width="1" class="s-steel-dark"/>
    </pattern>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#e85f08" class="f-melt"/>
    </marker>
    <marker id="arr-oil" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#ac6eef" class="f-machine"/>
    </marker>
  </defs>

  <!-- ── Die Stationen: ① über dem Speicher, ② und ③ unter ihren Teilen, ④ am Anschnitt ── -->
  <g font-size="15" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">
    <text x="105" y="36">① Druckspeicher</text>
    <text x="135" y="378">② Drossel und Antriebszylinder</text>
    <text x="470" y="378">③ Gießkolben und Füllkammer</text>
  </g>
  <text x="650" y="378" font-size="13" fill="#4c6870" class="f-muted" text-anchor="middle">Druckgießform</text>

  <!-- ── ① Druckspeicher: Flasche, Gaspolster über Öl ── -->
  <path d="M60 132 L60 76 Q60 54 105 54 Q150 54 150 76 L150 132 Q128 139 105 132 Q82 125 60 132 Z" fill="#68a7cc" fill-opacity="0.16" class="f-air"/>
  <path d="M60 132 Q82 125 105 132 T150 132 L150 194 L60 194 Z" fill="#ac6eef" fill-opacity="0.24" class="f-machine"/>
  <path d="M60 76 Q60 54 105 54 Q150 54 150 76 L150 194 L60 194 Z" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <path d="M60 132 Q82 125 105 132 T150 132" fill="none" stroke="#7b9096" stroke-width="1" class="s-steel-dark"/>
  <text x="105" y="100" font-size="13" fill="#4c6870" class="f-muted" text-anchor="middle">Gaspolster</text>
  <text x="105" y="170" font-size="13.5" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">Öl</text>

  <!-- Leitung mit Drossel: aus dem Speicher senkrecht hinunter in den Zylinderboden -->
  <rect x="98" y="194" width="14" height="48" fill="#ac6eef" fill-opacity="0.24" class="f-machine"/>
  <path d="M98 194 L98 242 M112 194 L112 242" fill="none" stroke="#7b9096" stroke-width="2" class="s-steel-dark"/>
  <path d="M88 209 L88 227 L105 218 Z M122 209 L122 227 L105 218 Z" fill="#7b9096" class="f-steel-dark"/>
  <line x1="105" y1="229" x2="105" y2="240" stroke="#ac6eef" stroke-width="1.5" class="s-machine" marker-end="url(#arr-oil)"/>
  <text x="82" y="223" font-size="13" fill="#4c6870" class="f-muted" text-anchor="end">Drossel</text>

  <!-- ── ② Antriebszylinder unter dem Speicher: großer Kolben, Fläche A_h ── -->
  <rect x="32" y="244" width="118" height="92" fill="#ac6eef" fill-opacity="0.24" class="f-machine"/>
  <rect x="150" y="244" width="16" height="92" fill="#36545d" class="f-piston"/>
  <rect x="166" y="282" width="184" height="16" fill="#36545d" fill-opacity="0.4" stroke="#36545d" stroke-width="1" class="f-piston s-piston"/>
  <path d="M98 242 L30 242 L30 338 L240 338 L240 298 M240 282 L240 242 L112 242" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <text x="91" y="295" font-size="13.5" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">Öl</text>
  <path d="M158 234 L158 242" fill="none" stroke="#4c6870" stroke-width="1" class="s-muted"/>
  <text x="132" y="229" font-size="13" fill="#4c6870" class="f-muted">Antriebskolben A<tspan font-size="72%" dy="3">h</tspan></text>
  <text x="285" y="275" font-size="13" fill="#4c6870" class="f-muted" text-anchor="middle">Kolbenstange</text>

  <!-- ── Formhälften: die Füllkammer endet bündig an der Trennebene ── -->
  <rect x="560" y="60" width="180" height="290" fill="url(#die-hatch)"/>
  <!-- Die Trennebene vor dem Freistellen: in Kammer, Anguss und Gussteil verschwindet sie -->
  <line x1="650" y1="58" x2="650" y2="352" stroke="#7b9096" stroke-width="1" stroke-dasharray="5 4" class="s-steel-dark"/>
  <!-- Kammerbohrung, Anguss, Anschnitt und Gussteil freistellen: in der
       Fläche hinter dem Bild (surface2, wie der Bildkasten), darüber liegt
       gleich die Schmelze -->
  <rect x="560" y="268" width="100" height="44" fill="#f8fafa" class="f-surface2"/>
  <rect x="640" y="150" width="20" height="162" fill="#f8fafa" class="f-surface2"/>
  <rect x="645" y="134" width="10" height="18" fill="#f8fafa" class="f-surface2"/>
  <path d="M590 136 L590 102 L612 102 L612 82 L688 82 L688 102 L710 102 L710 136 Z" fill="#f8fafa" class="f-surface2"/>
  <!-- Umriss der Form: offen, wo die Füllkammer durch die feste Seite geht -->
  <path d="M560 268 L560 60 L740 60 L740 350 L560 350 L560 312" fill="none" stroke="#7b9096" stroke-width="1.5" class="s-steel-dark"/>
  <text x="650" y="50" font-size="13" fill="#4c6870" class="f-muted" text-anchor="middle">Trennebene</text>
  <text x="605" y="340" font-size="10.5" fill="#4c6870" class="f-muted" text-anchor="middle">feste Seite</text>
  <text x="695" y="340" font-size="10.5" fill="#4c6870" class="f-muted" text-anchor="middle">bewegliche Seite</text>

  <!-- ── ③ Füllkammer: Gießkolben (Fläche A_K) hinten, die Einfüllöffnung gleich davor, das Rohr bis zur Trennebene ── -->
  <path d="M438 270 L640 270 L640 150 L645 150 L645 136 L655 136 L655 150 L660 150 L660 310 L438 310 Z" fill="#e85f08" fill-opacity="0.3" class="f-melt"/>
  <path d="M590 136 L590 102 L612 102 L612 82 L688 82 L688 102 L710 102 L710 136 Z" fill="#e85f08" fill-opacity="0.3" class="f-melt"/>
  <rect x="350" y="270" width="88" height="40" fill="#36545d" class="f-piston"/>
  <path d="M330 268 L446 268 M482 268 L640 268 M330 312 L660 312" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <path d="M446 268 L446 254 L438 244 M482 268 L482 254 L490 244" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <text x="464" y="236" font-size="13" fill="#4c6870" class="f-muted" text-anchor="middle">Einfüllöffnung</text>
  <text x="394" y="294" font-size="11.5" fill="#ffffff" class="f-surface" text-anchor="middle">Gießkolben A<tspan font-size="72%" dy="3">K</tspan></text>
  <text x="545" y="295" font-size="14" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">Schmelze</text>
  <line x1="590" y1="290" x2="618" y2="290" stroke="#e85f08" stroke-width="1.8" class="s-melt" marker-end="url(#arr)"/>

  <!-- Anguss: steigt in der Trennebene aus dem Kammerende, der Anschnitt als Engstelle, darüber das Gussteil -->
  <path d="M640 268 L640 150 L645 150 L645 136 M655 136 L655 150 L660 150 L660 312" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <path d="M645 136 L590 136 L590 102 L612 102 L612 82 L688 82 L688 102 L710 102 L710 136 L655 136" fill="none" stroke="#7b9096" stroke-width="2.5" class="s-steel-dark"/>
  <line x1="650" y1="252" x2="650" y2="214" stroke="#e85f08" stroke-width="1.8" class="s-melt" marker-end="url(#arr)"/>
  <text x="650" y="124" font-size="13.5" font-weight="700" fill="#002733" class="f-text" text-anchor="middle">Gussteil</text>

  <!-- ── ④ Anschnitt und Anguss: rechts neben der Form beschriftet ── -->
  <line x1="657" y1="143" x2="748" y2="143" stroke="#4c6870" stroke-width="1" stroke-dasharray="2 2" class="s-muted"/>
  <text x="752" y="147" font-size="13" font-weight="700" fill="#002733" class="f-text">④ Anschnitt</text>
  <line x1="662" y1="218" x2="748" y2="218" stroke="#4c6870" stroke-width="1" stroke-dasharray="2 2" class="s-muted"/>
  <text x="752" y="223" font-size="13" fill="#4c6870" class="f-muted">Anguss</text>
</svg>
