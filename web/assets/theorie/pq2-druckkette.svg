<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Druckkette vom Druckspeicher über Antriebskolben und Füllkammer bis zum Anschnitt">
  <!-- Handgezeichnetes Schema. Konventionen: Indizes als tspan (70 %, dy 3),
       Ölkreis gold, Schmelze/Metallseite petrol, Stahlteile grau.
       Größenlogik: Druckspeicher-Flasche > Antriebszylinder > Füllkammer;
       die Einfüllöffnung der Kammer zeigt nach oben und ist vom
       vorgefahrenen Gießkolben bereits verschlossen. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#008c82"/>
    </marker>
  </defs>

  <!-- ── Stations-Überschriften ── -->
  <text x="110" y="34" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">① Druckspeicher</text>
  <text x="110" y="52" font-size="11.5" fill="#475569" text-anchor="middle">P<tspan font-size="70%" dy="3">acc</tspan><tspan dy="-3"> = 160 bar</tspan></text>
  <text x="368" y="34" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">② Antriebskolben, Fläche A<tspan font-size="70%" dy="3">h</tspan></text>
  <text x="368" y="52" font-size="11.5" fill="#475569" text-anchor="middle">P<tspan font-size="70%" dy="3">h</tspan><tspan dy="-3"> = P</tspan><tspan font-size="70%" dy="3">acc</tspan><tspan dy="-3"> − K</tspan><tspan font-size="70%" dy="3">v</tspan><tspan dy="-3">·v²</tspan></text>
  <text x="655" y="34" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">③ Füllkammer, Fläche A<tspan font-size="70%" dy="3">K</tspan></text>
  <text x="655" y="52" font-size="11.5" fill="#475569" text-anchor="middle">p = P<tspan font-size="70%" dy="3">h</tspan><tspan dy="-3"> · A</tspan><tspan font-size="70%" dy="3">h</tspan><tspan dy="-3">/A</tspan><tspan font-size="70%" dy="3">K</tspan></text>
  <text x="838" y="34" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">④ Anschnitt</text>
  <text x="838" y="52" font-size="11.5" fill="#475569" text-anchor="middle">p → ½·ρ·v<tspan font-size="70%" dy="3">a</tspan><tspan dy="-3">²</tspan></text>

  <!-- ── ① Druckspeicher: große Flasche, Gaspolster über Öl ── -->
  <path d="M60 92 Q60 70 110 70 Q160 70 160 92 L160 300 L60 300 Z" fill="#e8edf1"/>
  <path d="M60 176 Q85 168 110 176 T160 176 L160 300 L60 300 Z" fill="rgba(224,164,0,.25)"/>
  <path d="M60 92 Q60 70 110 70 Q160 70 160 92 L160 300 L60 300 Z" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <path d="M60 176 Q85 168 110 176 T160 176" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="110" y="130" font-size="11" fill="#64748b" text-anchor="middle">Gaspolster</text>
  <text x="110" y="245" font-size="11" fill="#9a7100" text-anchor="middle">Öl</text>

  <!-- Leitung mit Drossel zum Antriebszylinder -->
  <rect x="160" y="252" width="110" height="14" fill="rgba(224,164,0,.25)"/>
  <line x1="160" y1="252" x2="270" y2="252" stroke="#64748b" stroke-width="2"/>
  <line x1="160" y1="266" x2="270" y2="266" stroke="#64748b" stroke-width="2"/>
  <path d="M200 245 L220 245 L210 252 Z" fill="#64748b"/>
  <path d="M200 273 L220 273 L210 266 Z" fill="#64748b"/>
  <text x="212" y="290" font-size="10.5" fill="#64748b" text-anchor="middle">Drossel −K<tspan font-size="70%" dy="3">v</tspan><tspan dy="-3">·v²</tspan></text>
  <path d="M270 252 L270 214 L282 214 M270 266 L270 236" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="270" y="236" width="12" height="16" fill="rgba(224,164,0,.25)"/>

  <!-- ── ② Antriebszylinder: kleiner als die Flasche, Öl drückt den Kolben ── -->
  <rect x="284" y="146" width="86" height="104" fill="rgba(224,164,0,.25)"/>
  <path d="M282 250 L282 144 L462 144 L462 182 M462 214 L462 252 L282 252" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <rect x="370" y="146" width="22" height="104" fill="#475569"/>
  <rect x="392" y="182" width="150" height="32" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <text x="330" y="204" font-size="13" font-weight="700" fill="#9a7100" text-anchor="middle">P<tspan font-size="70%" dy="3">h</tspan></text>
  <text x="372" y="272" font-size="10.5" fill="#64748b" text-anchor="middle">A<tspan font-size="70%" dy="3">h</tspan><tspan dy="-3"> = 1.250 cm²</tspan></text>

  <!-- ── ③ Füllkammer: liegendes Rohr, Einfüllöffnung oben (vom Kolben verschlossen) ── -->
  <!-- Rohrwände -->
  <path d="M542 176 L560 176 M604 176 L780 176 L806 186 M542 220 L780 220 L806 210" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <!-- Einfüllöffnung nach oben: Trichterstutzen zwischen x=560 und x=604 -->
  <path d="M560 176 L560 156 L554 146 M604 176 L604 156 L610 146" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <text x="582" y="138" font-size="10.5" fill="#64748b" text-anchor="middle">Einfüllöffnung</text>
  <text x="582" y="152" font-size="9.5" fill="#94a3b8" text-anchor="middle">▼</text>
  <!-- Schmelze vor dem Kolben -->
  <path d="M632 178 L780 178 L804 188 L804 208 L780 218 L632 218 Z" fill="rgba(0,140,130,.22)"/>
  <!-- Gießkolben: hat die Öffnung bereits passiert und verschließt sie -->
  <rect x="542" y="178" width="90" height="40" fill="#475569"/>
  <text x="587" y="203" font-size="10" fill="#e8edf1" text-anchor="middle">Gießkolben</text>
  <text x="712" y="194" font-size="11.5" font-weight="700" fill="#00655e" text-anchor="middle">Schmelze</text>
  <text x="712" y="209" font-size="10" fill="#00655e" text-anchor="middle">p bis 1.132 bar</text>
  <text x="668" y="243" font-size="10.5" fill="#64748b" text-anchor="middle">A<tspan font-size="70%" dy="3">K</tspan><tspan dy="-3"> = 177 cm² · ½·ρ·v</tspan><tspan font-size="70%" dy="3">p</tspan><tspan dy="-3">² &lt; 1 bar</tspan></text>

  <!-- ── ④ Anschnitt: Druck wird Geschwindigkeit ── -->
  <line x1="810" y1="198" x2="852" y2="198" stroke="#008c82" stroke-width="4" marker-end="url(#arr)"/>
  <text x="832" y="184" font-size="12" font-weight="700" fill="#008c82" text-anchor="middle">v<tspan font-size="70%" dy="3">a</tspan></text>
  <text x="826" y="228" font-size="10.5" fill="#64748b" text-anchor="middle">Kavität: p ≈ 0</text>

  <!-- ── Druckniveau entlang der Kette ── -->
  <text x="60" y="352" font-size="11" font-weight="700" fill="#475569">Druckniveau entlang der Kette (schematisch, nicht maßstäblich)</text>
  <line x1="60" y1="470" x2="860" y2="470" stroke="#ccd4d6" stroke-width="1.5"/>
  <text x="52" y="474" font-size="10" fill="#64748b" text-anchor="end">0 bar</text>

  <polyline points="60,432 212,432 236,438 392,438" fill="none" stroke="#e0a400" stroke-width="2.5"/>
  <text x="128" y="423" font-size="10.5" fill="#9a7100" text-anchor="middle">P<tspan font-size="70%" dy="3">acc</tspan><tspan dy="-3"> = 160 bar</tspan></text>
  <text x="316" y="429" font-size="10.5" fill="#9a7100" text-anchor="middle">P<tspan font-size="70%" dy="3">h</tspan><tspan dy="-3"> ≤ 160 bar</tspan></text>

  <line x1="392" y1="438" x2="582" y2="388" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="487" y="404" font-size="10.5" fill="#64748b" text-anchor="middle">Kolbenpaar: ×A<tspan font-size="70%" dy="3">h</tspan><tspan dy="-3">/A</tspan><tspan font-size="70%" dy="3">K</tspan><tspan dy="-3"> ≈ 7</tspan></text>

  <polyline points="582,388 790,388 820,468" fill="none" stroke="#008c82" stroke-width="2.5"/>
  <text x="686" y="379" font-size="10.5" fill="#00655e" text-anchor="middle">p₀ = F<tspan font-size="70%" dy="3">G</tspan><tspan dy="-3">/A</tspan><tspan font-size="70%" dy="3">K</tspan><tspan dy="-3"> = 1.132 bar (statisch)</tspan></text>
  <text x="786" y="438" font-size="10.5" fill="#00655e" text-anchor="end">Anschnitt: p → ½·ρ·v<tspan font-size="70%" dy="3">a</tspan><tspan dy="-3">²</tspan></text>
</svg>
