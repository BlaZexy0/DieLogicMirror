<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- DieLogic — das Zeichen zwischen „Die" und „Logic": zwei Formhälften mit
       Teilungsspalt, dazwischen schießt die Schmelze als Pfeil. Die Silhouette
       bleibt ein H. Farben: Petrol #002733, Teal hell #3fc2b6. -->
  <rect x="56" y="56" width="400" height="400" rx="92" fill="#002733"/>
  <g transform="translate(136 136) scale(2.4)">
    <!-- linke Formhälfte, zur Teilung hin abgesetzt -->
    <path d="M0 0 H34 V34 H22 V66 H34 V100 H0 Z" fill="#ffffff"/>
    <!-- rechte Formhälfte -->
    <path d="M100 0 H66 V34 H78 V66 H66 V100 H100 Z" fill="#ffffff"/>
    <!-- die Schmelze im Spalt -->
    <path d="M22 40 L57 40 L57 27 L80 50 L57 73 L57 60 L22 60 Z" fill="#3fc2b6"/>
  </g>
</svg>
