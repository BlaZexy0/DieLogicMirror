<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="26" height="26" fill="none">
  <!-- 3D-Studio: Formkasten im Schrägbild, Trennebene, Kavität.
       Raster: Motiv innerhalb 2…24, Strich 1,6 (Hilfslinien 1,4 · 55 %).
       Farben sind Rollen der Palette (shared/palette.js), jedes Ding in
       seiner Sachfarbe: der Formkasten als Stahlkante (steelDark), die
       Trennebene in der Farbe des Werkzeugs (die), die Kavität in der Farbe
       der Schmelze (melt), der Kennfarbe des Studios. Der Hex-Rückfall ist
       der Standardwert der Rolle, für die Ansicht außerhalb der Seite. -->
  <symbol id="icon" viewBox="0 0 26 26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2.6 L22.4 8 L22.4 18 L13 23.4 L3.6 18 L3.6 8 Z" stroke="var(--steel-dark, #7b9096)" stroke-width="1.8"/>
    <path d="M3.6 8 L13 13.4 L22.4 8" stroke="var(--steel-dark, #7b9096)" stroke-width="1.5" opacity=".55"/>
    <path d="M13 13.4 V23.4" stroke="var(--steel-dark, #7b9096)" stroke-width="1.5" opacity=".55"/>
    <path d="M2.2 13.4 H23.8" stroke="var(--die, #2e65a0)" stroke-width="1.4" stroke-dasharray="2.6 2.2" opacity=".75"/>
    <path d="M13 10.2 L16.2 12 L16.2 15.4 L13 17.2 L9.8 15.4 L9.8 12 Z" fill="var(--melt, #e85f08)" opacity=".92"/>
  </symbol>
  <use href="#icon"/>
</svg>
