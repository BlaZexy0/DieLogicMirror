<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26" width="26" height="26" fill="none">
  <!-- Dashboard: Seitenleiste, Kurve mit Betriebspunkt, Prüfbalken.
       Raster: Motiv innerhalb 2…24, Strich 1,6 (Hilfslinien 1,4 · 70 %).
       Farben sind Rollen der Palette (shared/palette.js): das Werkzeug in der
       Marke (primary), der Betriebspunkt in der Hervorhebung (mark). Der
       Hex-Rückfall ist der Standardwert der Rolle, für die Ansicht außerhalb
       der Seite. -->
  <symbol id="icon" viewBox="0 0 26 26" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2.5" width="22" height="21" rx="2.5" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <line x1="9.5" y1="2.5" x2="9.5" y2="23.5" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <line x1="4.5" y1="7" x2="7" y2="7" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <line x1="4.5" y1="11" x2="7" y2="11" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <line x1="4.5" y1="15" x2="7" y2="15" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <path d="M12.5 14 L15 10.5 L17.5 12 L21 6.5" stroke="var(--primary, #008c82)" stroke-width="1.6"/>
    <circle cx="17.5" cy="12" r="1.7" fill="var(--mark, #b23797)"/>
    <rect x="12.5" y="17.5" width="5" height="2.2" rx="1.1" fill="var(--primary, #008c82)"/>
    <rect x="12.5" y="17.5" width="9" height="2.2" rx="1.1" stroke="var(--primary, #008c82)" stroke-width="1" opacity=".55"/>
  </symbol>
  <use href="#icon"/>
</svg>
