# Render-Blueprint: ein Web Service liefert Website + API aus einem Prozess.
# Repo auf GitHub verbinden → Render liest diese Datei ("New > Blueprint").
services:
  - type: web
    name: dielogic
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: dielogic-db
          property: connectionString
      # Ersten Admin ohne Shell anlegen: beide im Render-Dashboard setzen
      # (sync: false = Wert wird nicht aus dieser Datei gelesen). Einlösen
      # unter https://<host>/konto/?token=<DIELOGIC_ADMIN_TOKEN>.
      # Der Token muss 24 bis 64 Zeichen haben — er ist das einzige frei
      # gewählte Geheimnis im System (z. B. `openssl rand -base64 33`).
      # Ist er zu kurz oder zu lang, warnt der Start und legt die Einladung
      # nicht an; die Site läuft trotzdem.
      - key: DIELOGIC_ADMIN_EMAIL
        sync: false
      - key: DIELOGIC_ADMIN_TOKEN
        sync: false
      # Optional: Demo-Konto demo@dielogic.de mit diesem Passwort (nur zum
      # Ausprobieren; in Produktion weglassen).
      # E-Mail-Versand: off | log | smtp | resend (siehe backend/README.md).
      # Für resend zusätzlich DIELOGIC_RESEND_KEY und DIELOGIC_MAIL_FROM.
      - key: DIELOGIC_MAIL
        sync: false
      - key: DIELOGIC_RESEND_KEY
        sync: false
      - key: DIELOGIC_MAIL_FROM
        sync: false
      - key: DIELOGIC_DEMO_PASSWORD
        sync: false

databases:
  # Projekte, Benutzer, Einladungen. Region Frankfurt (EU-Datenhaltung);
  # der Free-Plan läuft nach 90 Tagen aus — vor Produktivbetrieb hochstufen.
  - name: dielogic-db
    plan: free
    region: frankfurt
