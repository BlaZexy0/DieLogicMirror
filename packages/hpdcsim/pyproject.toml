[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hpdcsim"
version = "0.1.0"
description = "Quasi-static HPDC shot simulation: dosing, dwell and shot with pluggable vacuum and thermal models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["hpdcsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
