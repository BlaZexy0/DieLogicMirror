<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Druckkette vom Druckspeicher über Antriebskolben und Füllkammer bis zum Anschnitt">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#008c82"/>
    </marker>
  </defs>

  <!-- ── Stations-Überschriften ── -->
  <text x="100" y="48" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">① Druckspeicher</text>
  <text x="100" y="66" font-size="11.5" fill="#475569" text-anchor="middle">P_acc = 160 bar</text>
  <text x="340" y="48" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">② Antriebskolben, Fläche A_h</text>
  <text x="340" y="66" font-size="11.5" fill="#475569" text-anchor="middle">P_h = P_acc − K_v·v²</text>
  <text x="650" y="48" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">③ Füllkammer, Fläche A_K</text>
  <text x="650" y="66" font-size="11.5" fill="#475569" text-anchor="middle">p = P_h · A_h/A_K</text>
  <text x="822" y="48" font-size="12.5" font-weight="700" fill="#1f2937" text-anchor="middle">④ Anschnitt</text>
  <text x="822" y="66" font-size="11.5" fill="#475569" text-anchor="middle">p → ½·ρ·v_a²</text>

  <!-- ── ① Druckspeicher (Tank): Gaspolster über Öl ── -->
  <rect x="60" y="100" width="80" height="65" fill="#e8edf1"/>
  <path d="M60 165 Q80 158 100 165 T140 165 L140 290 L60 290 Z" fill="rgba(224,164,0,.22)"/>
  <rect x="60" y="100" width="80" height="190" rx="5" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M60 165 Q80 158 100 165 T140 165" fill="none" stroke="#64748b" stroke-width="1"/>
  <text x="100" y="138" font-size="11" fill="#64748b" text-anchor="middle">Gas</text>
  <text x="100" y="235" font-size="11" fill="#64748b" text-anchor="middle">Öl</text>

  <!-- Leitung mit Drossel zum Zylinder -->
  <rect x="140" y="250" width="92" height="16" fill="rgba(224,164,0,.22)"/>
  <line x1="140" y1="250" x2="232" y2="250" stroke="#64748b" stroke-width="2"/>
  <line x1="140" y1="266" x2="232" y2="266" stroke="#64748b" stroke-width="2"/>
  <path d="M175 242 L195 242 L185 250 Z" fill="#64748b"/>
  <path d="M175 274 L195 274 L185 266 Z" fill="#64748b"/>
  <text x="186" y="290" font-size="10.5" fill="#64748b" text-anchor="middle">Drossel −K_v·v²</text>

  <!-- ── ② Antriebszylinder: Öl bei P_h drückt auf den großen Kolben ── -->
  <rect x="232" y="92" width="90" height="196" fill="rgba(224,164,0,.22)"/>
  <path d="M230 250 L230 90 L450 90 L450 174 M450 206 L450 290 L230 290 L230 266" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="322" y="92" width="24" height="196" fill="#475569"/>
  <rect x="346" y="174" width="186" height="32" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
  <text x="277" y="195" font-size="13" font-weight="700" fill="#1f2937" text-anchor="middle">P_h</text>
  <text x="340" y="308" font-size="10.5" fill="#64748b" text-anchor="middle">A_h = 1.250 cm² (Ø ≈ 400 mm)</text>

  <!-- ── ③ Füllkammer: Gießkolben drückt auf die Schmelze ── -->
  <path d="M556 153 L771 153 L799 180 L799 200 L771 227 L556 227 Z" fill="rgba(0,140,130,.20)"/>
  <path d="M530 152 L770 152 L800 180 M530 228 L770 228 L800 200 M530 152 L530 174 M530 206 L530 228" fill="none" stroke="#64748b" stroke-width="2"/>
  <rect x="530" y="153" width="26" height="74" fill="#475569"/>
  <text x="668" y="187" font-size="11.5" font-weight="700" fill="#00655e" text-anchor="middle">Schmelze</text>
  <text x="668" y="204" font-size="10.5" fill="#00655e" text-anchor="middle">p bis 1.132 bar</text>
  <text x="650" y="250" font-size="10.5" fill="#64748b" text-anchor="middle">A_K = 177 cm² (Ø 150 mm) · v_p klein → ½·ρ·v_p² &lt; 1 bar</text>

  <!-- ── ④ Anschnitt: Druck wird Geschwindigkeit ── -->
  <line x1="803" y1="190" x2="848" y2="190" stroke="#008c82" stroke-width="4" marker-end="url(#arr)"/>
  <text x="822" y="176" font-size="12" font-weight="700" fill="#008c82" text-anchor="middle">v_a</text>
  <text x="822" y="222" font-size="10.5" fill="#64748b" text-anchor="middle">Kavität: p ≈ 0</text>

  <!-- ── Druckniveau entlang der Kette ── -->
  <text x="60" y="352" font-size="11" font-weight="700" fill="#475569">Druckniveau entlang der Kette (schematisch, nicht maßstäblich)</text>
  <line x1="60" y1="450" x2="860" y2="450" stroke="#ccd4d6" stroke-width="1.5"/>
  <text x="52" y="454" font-size="10" fill="#64748b" text-anchor="end">0 bar</text>

  <polyline points="60,412 173,412 197,418 346,418" fill="none" stroke="#e0a400" stroke-width="2.5"/>
  <text x="112" y="403" font-size="10.5" fill="#9a7100" text-anchor="middle">P_acc = 160 bar</text>
  <text x="272" y="409" font-size="10.5" fill="#9a7100" text-anchor="middle">P_h ≤ 160 bar</text>

  <line x1="346" y1="418" x2="556" y2="368" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="451" y="385" font-size="10.5" fill="#64748b" text-anchor="middle">Kolbenpaar: ×A_h/A_K ≈ 7</text>

  <polyline points="556,368 770,368 800,448" fill="none" stroke="#008c82" stroke-width="2.5"/>
  <text x="663" y="359" font-size="10.5" fill="#00655e" text-anchor="middle">p₀ = F_G/A_K = 1.132 bar (statisch)</text>
  <text x="766" y="418" font-size="10.5" fill="#00655e" text-anchor="end">Anschnitt: p → ½·ρ·v_a²</text>
</svg>
