# CI: läuft bei jedem Push auf main und bei Pull Requests.
# Zwei Jobs: Python (hpdcsim-Tests + Backend-Tests mit pytest: Konto, Projekte,
# Stammdaten, /api/sim/shot, Physik-Fixtures) und Frontend (Syntax + Node-Tests gegen die Beispiel-STLs,
# das Zuhaltungs-Modell, den Übernahme-Vertrag, die Preset-/Feld-Konsistenz,
# die STL-Rechenlogik, dieselben Physik-Fixtures gegen physics.js und die
# Geometrie/Analyse des 3D-Studios).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hpdcsim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Abhängigkeiten installieren
        # httpx: nur für den FastAPI-TestClient der Backend-Tests.
        run: pip install -r backend/requirements.txt "./packages/hpdcsim[plot]" httpx pytest
      - name: hpdcsim-Tests
        run: python packages/hpdcsim/tests/run_tests.py
      - name: Backend-Tests (pytest)
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-Check (alle JS + Inline-Scripts der HTML-Seiten)
        run: node tests/web/syntax-check.mjs
      - name: Frontend-Tests (alle *.test.mjs — inkl. Physik-Fixtures, Grenzen-Modell, Render-Rauchtest, 3D-Studio)
        # --import: für die 3D-Studio-Tests wird der nackte Name 'three' auf
        # web/tools/3d-studio/vendor/ aufgelöst und der WebGL-Renderer durch
        # eine Attrappe ersetzt (Node hat kein WebGL). Der Hook greift nur bei
        # genau diesen Namen — die übrigen Tests merken davon nichts.
        run: >-
          node --import ./tests/web/3d-studio/stubs/register.mjs
          --test tests/web/*.test.mjs tests/web/3d-studio/*.test.mjs
          tests/web/3d-studio/tools/*.test.mjs
      - name: Generierte Dateien aktuell? (Theorie-SVGs, v_krit-Tabellen, Icon-Sprite, Eingabegrenzen)
        # Die eingecheckten Artefakte müssen zum Code passen — alle
        # Generatoren sind deterministisch, ein Diff heißt: Regenerieren
        # vergessen (node scripts/gen-theory-svgs.mjs, gen-vkrit-table.mjs,
        # gen-palette.mjs bzw. gen-icon-sprite.mjs).
        run: |
          node scripts/gen-theory-svgs.mjs
          node scripts/gen-vkrit-table.mjs
          node scripts/gen-palette.mjs
          node scripts/gen-icon-sprite.mjs
          node scripts/gen-domain-doc.mjs
          git diff --exit-code -- web/assets/theorie web/assets/palette.svg web/tools/auslegung/js/core/vkritTable.js packages/hpdcsim/hpdcsim/_vkrit_table.py web/index.html docs/eingabegrenzen.md
