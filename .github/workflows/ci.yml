# CI: läuft bei jedem Push auf main und bei Pull Requests.
# Zwei Jobs: Backend (pytest: Konto, Projekte, Stammdaten, Auslieferung) und
# Frontend (Syntax + Node-Tests gegen die Beispiel-STLs, das Zuhaltungs-Modell,
# den Übernahme-Vertrag, die Preset-/Feld-Konsistenz, die STL-Rechenlogik, die
# Physik-Fixtures, die Referenzfälle der Luftsimulation und die
# Geometrie/Analyse des 3D-Studios).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Abhängigkeiten installieren
        # httpx: nur für den FastAPI-TestClient der Backend-Tests.
        run: pip install -r backend/requirements.txt httpx pytest
      - name: Backend-Tests (pytest)
        run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Abhängigkeiten installieren (ESLint)
        run: npm ci
      - name: Lint, Syntax-Check und Frontend-Tests (npm run check)
        # Dieselbe Befehlszeile wie lokal (package.json): eslint, dann
        # tests/web/syntax-check.mjs und alle *.test.mjs. Für die
        # 3D-Studio-Tests löst --import den nackten Namen 'three' auf
        # web/tools/3d-studio/vendor/ auf und ersetzt den WebGL-Renderer durch
        # eine Attrappe (Node hat kein WebGL). Vorher stand die Testzeile hier
        # als Kopie, und gelintet wurde gar nicht.
        run: npm run check
      - name: Generierte Dateien aktuell? (Theorie-SVGs, v_krit-Tabelle, Icon-Sprite, Eingabegrenzen)
        # Die eingecheckten Artefakte müssen zum Code passen — alle
        # Generatoren sind deterministisch, ein Diff heißt: Regenerieren
        # vergessen (node scripts/gen-theory-svgs.mjs, gen-vkrit-table.mjs,
        # gen-palette.mjs, gen-icon-sprite.mjs bzw. gen-domain-doc.mjs, das
        # auch die Grenzen des Servers schreibt: backend/_domain.py).
        run: |
          node scripts/gen-theory-svgs.mjs
          node scripts/gen-vkrit-table.mjs
          node scripts/gen-palette.mjs
          node scripts/gen-icon-sprite.mjs
          node scripts/gen-domain-doc.mjs
          git diff --exit-code -- web/assets/theorie web/assets/palette.svg web/tools/auslegung/js/core/vkritTable.js web/index.html docs/eingabegrenzen.md backend/_domain.py
